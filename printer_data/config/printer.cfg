[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_2B002D000B47393435363339-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 700
max_accel: 8000 
#max_accel_to_decel: 8000
max_z_velocity: 8  
max_z_accel: 500
square_corner_velocity: 10.0


[exclude_object]

[input_shaper]
#shaper_freq_x: 64.0
#shaper_freq_y: 60.0
#shaper_type: zv
shaper_freq_x: 64.6
shaper_type_x: ei
shaper_freq_y: 61.2
shaper_type_y: ei


[include mainsail.cfg]
[include stepper.cfg]
#[include idm.cfg]
[include include/*.cfg]

[pause_resume]


[force_move]
enable_force_move: True

