[output_pin LED1]
pin: HEAT0
pwm: true
shutdown_value: 0.0
value: 0.0
cycle_time: 0.010
#scale:100


[output_pin LED2]
pin: HEAT1
pwm: true
shutdown_value: 0.0
value: 0.0
cycle_time: 0.010

#[output_pin neopixel_m5]
#pin: PF13
#shutdown_value: 0.0
#value: 0
#scale:100

#[output_pin caselight_btn]
#pin: FAN5
#pwm: true
#shutdown_value: 0.0
#value: 10.00
#cycle_time: 0.01
#scale: 100

[gcode_macro _CASELIGHT_OFF]
gcode:
#  #SET_PIN pin=caselight_btn value=10
  SET_PIN pin=LED1 value=0.0
  SET_PIN pin=LED2 value=0.0
#  {action_respond_info("Light off")}

[gcode_macro _CASELIGHT_ON]
gcode:
#  #SET_PIN pin=caselight_btn value=100
  SET_PIN pin=LED1 value=0.1
  SET_PIN pin=LED2 value=0.1
#  {action_respond_info("Light on")}

[gcode_macro CASELIGHT_SWITCH]
gcode =
  #{action_respond_info("val: %.1f" % (printer["output_pin caselight_btn"].value))}   
   {% if printer["output_pin LED1"].value|float == 0.0 %}
        _CASELIGHT_ON
    {% else %}
        _CASELIGHT_OFF
    {% endif %}

[gcode_button LIGHT_BUTTON]
pin = ^ES_SW2
press_gcode:
  {action_respond_info("led press")}
  CASELIGHT_SWITCH